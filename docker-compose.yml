x-backend: &backend
  build: ./backend
  environment: &env
    DATABASE_URL: postgresql+psycopg://reviewer:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/reviewer
    REDIS_URL: redis://redis:6379/0
    SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
    TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-}
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-5-5}
    LLM_PROVIDER_ORDER: ${LLM_PROVIDER_ORDER:-anthropic,ollama}
    OLLAMA_URL: ${OLLAMA_URL:-}
    OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1:8b}
    GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
    PII_ENGINE: ${PII_ENGINE:-regex}
    GITHUB_APP_ID: ${GITHUB_APP_ID:-}
    GITHUB_APP_SLUG: ${GITHUB_APP_SLUG:-}
    GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
    GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
    GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
    OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
    SANDBOX_ENABLED: ${SANDBOX_ENABLED:-false}
    SANDBOX_REPOS_VOLUME: reviewer_repos
    REPO_RETENTION_HOURS: ${REPO_RETENTION_HOURS:-72}
    TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
    WORKDIR: /data/repos
    CORS_ORIGINS: http://localhost:3000
    PUBLIC_APP_URL: http://localhost:3000
    PUBLIC_API_URL: http://localhost:8000
  volumes:
    - repos:/data/repos
  depends_on:
    db: { condition: service_healthy }
    redis: { condition: service_healthy }

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: reviewer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: reviewer
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U reviewer"], interval: 5s, retries: 10 }

  redis:
    image: redis:7-alpine
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, retries: 10 }

  api:
    <<: *backend
    ports: ["8000:8000"]

  worker:
    <<: *backend
    command: celery -A app.worker.celery_app.celery_app worker --loglevel=info --concurrency=2

  beat:
    <<: *backend
    command: celery -A app.worker.celery_app.celery_app beat --loglevel=info --schedule /tmp/celerybeat-schedule
    volumes: []

  frontend:
    build: ./frontend
    ports: ["3000:3000"]
    depends_on: [api]

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    ports: ["16686:16686"]

  ollama:
    image: ollama/ollama:0.5.4
    profiles: ["selfhosted"]
    volumes: [ollama:/root/.ollama]

volumes:
  pgdata:
  repos:
    name: reviewer_repos
  ollama:
